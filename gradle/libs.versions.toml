[versions]
android = "9.2.1"
activityCompose = "1.13.0"
autofill = "1.3.0"
buildkonfigGradlePlugin = "0.22.0"
core = "1.7.0"
cryptographyProviderOptimal = "0.6.0"
cryptographyCore = "0.6.0"
datastorePreferences = "1.2.1"
kotlin = "2.4.0"
compose = "1.11.1"
decompose = "3.5.0"
kover = "0.9.8"
dokka = "2.2.0"
koin = "4.2.2"
color = "4.1.1"
coroutines = "1.11.0"
material = "1.14.0"
material3 = "1.9.0"
materialIconsExtended = "1.7.3"
sql = "2.3.2"
settings = "1.3.0"
startupRuntime = "1.2.0"

# These are needed for device testing
espresso = "3.7.0"
androidTest = "1.7.0"
androidxJunit = "1.3.0"

[libraries]
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
autofill = { module = "androidx.autofill:autofill", version.ref = "autofill" }
core = { module = "androidx.test:core", version.ref = "core" }
cryptography-core = { module = "dev.whyoleg.cryptography:cryptography-core", version.ref = "cryptographyCore" }
cryptography-provider-optimal = { module = "dev.whyoleg.cryptography:cryptography-provider-optimal", version.ref = "cryptographyProviderOptimal" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastorePreferences" }
decompose = { module = "com.arkivanov.decompose:decompose", version.ref = "decompose" }
decompose-compose = { module = "com.arkivanov.decompose:extensions-compose", version.ref = "decompose" }
foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
koin = { module = "io.insert-koin:koin-core", version.ref = "koin" }
color = { module = "com.materialkolor:material-kolor", version.ref = "color" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
kotlin-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
material = { module = "com.google.android.material:material", version.ref = "material" }
material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "materialIconsExtended" }
material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
sql = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sql" }
sql-sqlite = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sql" }
sql-native = { module = "app.cash.sqldelight:native-driver", version.ref = "sql" }
sql-android = { module = "app.cash.sqldelight:android-driver", version.ref = "sql" }
settings = { module = "com.russhwolf:multiplatform-settings", version.ref = "settings" }
settings-coroutines = { module = "com.russhwolf:multiplatform-settings-coroutines", version.ref = "settings" }
settings-datastore = { module = "com.russhwolf:multiplatform-settings-datastore", version.ref = "settings" }
settings-test = { module = "com.russhwolf:multiplatform-settings-test", version.ref = "settings" }

startup-runtime = { module = "androidx.startup:startup-runtime", version.ref = "startupRuntime" }
ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
ui-test-junit4 = { module = "org.jetbrains.compose.ui:ui-test-junit4", version.ref = "compose" }

espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
test-runner = { module = "androidx.test:runner", version.ref = "androidTest" }
test-rules = { module = "androidx.test:rules", version.ref = "androidTest" }
test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }

[plugins]
kotlin = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose  = { id = "org.jetbrains.compose", version.ref = "compose" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
android-app = { id = "com.android.application", version.ref = "android" }
android-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "android" }
buildkonfig = { id = "com.codingfeline.buildkonfig", version.ref = "buildkonfigGradlePlugin" }
sql-delight = { id = "app.cash.sqldelight", version.ref = "sql" }
